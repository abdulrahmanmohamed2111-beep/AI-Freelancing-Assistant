name: freelance-assistant
services:
  database:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: freelance
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_database.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - freelance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelance -d freelance"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  freelance_pgdata:
